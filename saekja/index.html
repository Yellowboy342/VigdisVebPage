<!DOCTYPE html>
<html lang="is">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Smart download link for ads and posts: iPhone/iPad -> App Store,
         Android -> Google Play, everything else -> the homepage.
         ?src=<name> is passed through as the App Store campaign token (ct)
         and the Play referrer utm_campaign, e.g. /saekja?src=meta_ad -->
    <meta name="robots" content="noindex, nofollow">

    <title>Sækja Vigdís</title>

    <link rel="icon" type="image/png" href="/152x152bb-80.png">

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var src = (params.get('src') || 'web_redirect').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'web_redirect';

            var ua = navigator.userAgent || '';
            // iPadOS 13+ reports itself as a Mac; touch support gives it away.
            var isIOS = /iPhone|iPad|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);

            var target;
            if (isIOS) {
                target = 'https://apps.apple.com/is/app/vigdis/id6760764940?ct=' + src;
            } else if (isAndroid) {
                target = 'https://play.google.com/store/apps/details?id=com.vigdis.app&referrer=' +
                    encodeURIComponent('utm_source=vigdisapp.is&utm_medium=redirect&utm_campaign=' + src);
            } else {
                target = '/?src=' + src;
            }
            window.location.replace(target);
        })();
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFAF8;
            color: #2C2C2C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 16px; }
        a {
            display: inline-block;
            margin: 6px;
            padding: 12px 20px;
            border-radius: 999px;
            background: #A2494A;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Only seen for a moment, or when JavaScript is off. -->
    <main>
        <h1>Sækja Vigdís</h1>
        <a href="https://apps.apple.com/is/app/vigdis/id6760764940?ct=web_redirect">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.vigdis.app">Google Play</a>
    </main>
</body>

</html>
